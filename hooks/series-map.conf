# ~/homeserver/hooks/series-map.conf — release name -> library folder
#
# Used by hooks/qbt-file, the qBittorrent "Run on torrent finished" hook.
#
# WHY THIS FILE EXISTS. The hook turns a release name like
#   Harbor.Town.S02E03.1080p.WEB-DL.x265-GROUP.mkv
# into a library path, and it can do that on its own -- it strips the quality/group
# noise and files under the parsed title. This file is the OVERRIDE table for the
# cases where the parsed title is not the name you want on disk, which is mainly
# when the folder needs a year or a disambiguator the release name never carried:
#   'Harbor.Town.US' parses to 'Harbor Town US'; you want 'Harbor Town (US) (2005)'.
#
# It is NOT a gate. A show missing from here still files, under its parsed name.
# It used to be a gate, and that was wrong: every new show stopped dead in
# /downloads until this file was hand-edited and the hook re-run, which is a
# failure you only discover by reading a log. Changed 2026-09-21. Films have
# always worked this way; TV now matches them.
#
# FORMAT:   <match text> | <exact library folder name>
#   - match text is compared case-insensitively with punctuation and spacing ignored,
#     so "harbor town us" matches "Harbor.Town.US", "Harbor Town (US)", "harbor_town_us".
#   - the folder name on the right is used VERBATIM, both as the directory under
#     /mnt/t7/TV and as the filename prefix. It is the naming scheme, so it must
#     already be in the form:  Title (Year)
#   - lines starting with # and blank lines are ignored.
#
# ADDING A SHOW: you do not have to. Download it and it files itself. Add a line
# here only to CHANGE where it lands — the hook logs the exact line to paste,
# pre-filled with what it used. No restart needed, the file is read on every run.
#
# Example entries (made-up shows; the real table is local to the server):

harbor town us         | Harbor Town (US) (2005)
night shift            | Night Shift (2019)

# --- movies ---------------------------------------------------------------------
# Movies do not need entries here. The hook reads "Title (Year)" straight out of the
# release name, because a movie release almost always carries its year. Add a line
# only to override a title the parser gets wrong.
